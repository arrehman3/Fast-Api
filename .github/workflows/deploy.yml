name: FastAPI CI/CD Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify FastAPI application
        run: |
          python -c "from main import app; print('FastAPI application loaded successfully')"

      - name: Build Docker image
        run: |
          docker build -t fastapi-demo .
      
  cd:
    name: Continuous Deployment
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/fastapi_ec2
          chmod 600 ~/.ssh/fastapi_ec2

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/fastapi_ec2 \
            -o IdentitiesOnly=yes \
            "$EC2_USER@$EC2_HOST" 'bash -s' <<'REMOTE'

          set -e

          cd /home/ubuntu/projects/fastapi-demo

          echo "Pulling latest code..."
          git pull --ff-only origin main

          echo "Building Docker image..."
          sudo docker build -t fastapi-demo .

          echo "Replacing old container..."
          sudo docker rm -f fastapi-docker || true

          echo "Starting new container..."
          sudo docker run -d \
            --name fastapi-docker \
            --restart unless-stopped \
            -p 127.0.0.1:8000:8000 \
            fastapi-demo

          echo "Checking application..."
          sleep 3
          curl --fail --silent --show-error http://127.0.0.1:8000/

          echo "Deployment successful!"

          REMOTE
    
